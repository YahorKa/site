name: IndexNow ping

on:
  push:
    branches: [astro]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "content-type: application/json" \
            -d '{
              "host": "izostudio.by",
              "key": "ca603a647563acba67593ca10eb6f07f",
              "keyLocation": "https://izostudio.by/ca603a647563acba67593ca10eb6f07f.txt",
              "urlList": [
                "https://izostudio.by/",
                "https://izostudio.by/detyam",
                "https://izostudio.by/vzroslym",
                "https://izostudio.by/services",
                "https://izostudio.by/about",
                "https://izostudio.by/contacts",
                "https://izostudio.by/gallery",
                "https://izostudio.by/zayavka"
              ]
            }'
