[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Хэшированные имена — файл под этим URL никогда не меняется.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Картинки. Имена не хэшированы, поэтому 30 дней вместо года:
# при замене файла под тем же именем браузер подхватит новую версию за месяц.
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/teachers/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/preview.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/404.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/preview.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/map-placeholder.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/nastaMua.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon-120.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Служебные страницы не должны попадать в индекс.
[[headers]]
  for = "/spasibo/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/oshibka/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Старый маршрут формы со времён сайта на Rust.
[[redirects]]
  from = "/form"
  to = "/zayavka/"
  status = 301
  force = true

[[redirects]]
  from = "/form/"
  to = "/zayavka/"
  status = 301
  force = true

[functions]
  directory = "netlify/functions"
